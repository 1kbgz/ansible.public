---
- name: Copy airflow-celery-worker service
  ansible.builtin.copy:
    dest: /lib/systemd/system/airflow-celery-worker.service
    mode: '0644'
    owner: root
    group: root
    content: |
      [Unit]
      Description=Airflow Celery Worker, instance
      Wants=network.target
      After=network.target

      [Service]
      User=airflow
      Environment=AIRFLOW_HOME=/var/lib/airflow
      Type=simple
      # https://github.com/apache/airflow/issues/59707 — re-enable --celery-hostname when fixed
      # ExecStart=/var/lib/venvs/airflow/bin/airflow celery worker --queues {{CELERY_WORKER_QUEUES}} --celery-hostname {{inventory_hostname}} --pid /var/lib/airflow/celery/{{inventory_hostname}}.pid --concurrency {{CELERY_WORKER_COUNT*4}}
      ExecStart=/var/lib/venvs/airflow/bin/airflow celery worker --queues {{CELERY_WORKER_QUEUES}} --pid /var/lib/airflow/celery/{{inventory_hostname}}.pid --concurrency {{CELERY_WORKER_COUNT*4}}

      Restart=on-failure
      RestartSec=5s
      PrivateTmp=true

      [Install]
      WantedBy=multi-user.target
  notify:
    - Reload daemon files
    - Restart celery worker
  become: true

- name: Restart celery worker after upgrade
  ansible.builtin.systemd:
    name: airflow-celery-worker
    state: restarted
    enabled: true
  become: true
  when: airflow_upgraded | default(false)

- name: Ensure celery worker is started and enabled
  ansible.builtin.systemd:
    name: airflow-celery-worker
    state: started
    enabled: true
  become: true
