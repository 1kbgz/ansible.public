---
- name: Copy airflow-celery-worker service
  ansible.builtin.copy:
    dest: /lib/systemd/system/airflow-celery-worker.service
    mode: '0644'
    owner: root
    group: root
    content: |
      [Unit]
      Description=Airflow Celery Worker, instance
      Wants=network-online.target
      After=network-online.target
      RequiresMountsFor=/var/lib/airflow /home/airflow

      [Service]
      User=airflow
      Environment=AIRFLOW_HOME=/var/lib/airflow
      Type=simple
      # https://github.com/apache/airflow/issues/59707 — re-enable --celery-hostname when fixed
      # ExecStart=/var/lib/venvs/airflow/bin/airflow celery worker --queues {{CELERY_WORKER_QUEUES}} --celery-hostname {{inventory_hostname}} --pid /var/lib/airflow/celery/{{inventory_hostname}}.pid --concurrency {{CELERY_WORKER_COUNT*4}}
      ExecStart=/var/lib/venvs/airflow/bin/airflow celery worker --queues {{CELERY_WORKER_QUEUES}} --pid /var/lib/airflow/celery/{{inventory_hostname}}.pid --concurrency {{CELERY_WORKER_COUNT*4}}

      Restart=on-failure
      RestartSec=5s
      PrivateTmp=true
      {% if CELERY_WORKER_CPU_QUOTA %}
      CPUQuota={{ CELERY_WORKER_CPU_QUOTA }}
      {% endif %}
      CPUWeight={{ CELERY_WORKER_CPU_WEIGHT }}
      IOWeight={{ CELERY_WORKER_IO_WEIGHT }}
      MemoryHigh={{ CELERY_WORKER_MEMORY_HIGH }}
      MemoryMax={{ CELERY_WORKER_MEMORY_MAX }}
      MemorySwapMax={{ CELERY_WORKER_MEMORY_SWAP_MAX }}
      TasksMax={{ CELERY_WORKER_TASKS_MAX }}
      OOMScoreAdjust={{ CELERY_WORKER_OOM_SCORE_ADJUST }}
      ManagedOOMMemoryPressure={{ CELERY_WORKER_MANAGED_OOM_MEMORY_PRESSURE }}
      {% if CELERY_WORKER_MANAGED_OOM_MEMORY_PRESSURE_LIMIT %}
      ManagedOOMMemoryPressureLimit={{ CELERY_WORKER_MANAGED_OOM_MEMORY_PRESSURE_LIMIT }}
      {% endif %}
      ManagedOOMSwap={{ CELERY_WORKER_MANAGED_OOM_SWAP }}

      [Install]
      WantedBy=multi-user.target
  notify:
    - Reload daemon files
    - Restart celery worker
  become: true

- name: Validate airflow-celery-worker service
  ansible.builtin.command:
    argv:
      - systemd-analyze
      - verify
      - /lib/systemd/system/airflow-celery-worker.service
  changed_when: false
  become: true

- name: Flush handlers before starting celery worker
  ansible.builtin.meta: flush_handlers

- name: Restart celery worker after upgrade
  ansible.builtin.systemd:
    name: airflow-celery-worker
    state: restarted
    enabled: true
  become: true
  when: airflow_upgraded | default(false)

- name: Ensure celery worker is started and enabled
  ansible.builtin.systemd:
    name: airflow-celery-worker
    state: started
    enabled: true
  become: true
