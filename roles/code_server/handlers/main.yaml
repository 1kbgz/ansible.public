---
- name: Restart code-server on macOS
  community.general.homebrew_services:
    name: code-server
    state: restarted
  when:
    - CODE_SERVER_SERVICE_ENABLED | bool
    - ansible_facts['os_family'] == 'Darwin'
  listen: Restart code-server

- name: Restart code-server on Linux
  ansible.builtin.systemd:
    name: "code-server@{{ CODE_SERVER_USER }}"
    state: restarted
    daemon_reload: true
  become: true
  when:
    - CODE_SERVER_SERVICE_ENABLED | bool
    - ansible_facts['os_family'] == 'Debian'
  listen: Restart code-server
