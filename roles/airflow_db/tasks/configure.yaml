---
- name: Check to see if database has been initialized
  ansible.builtin.stat:
    path: /var/lib/postgresql/{{ POSTGRES_VERSION }}/airflow_data/postgresql.conf
  register: db_data
  become: true
  become_user: postgres

- name: Create airflow db
  ansible.builtin.shell: |
    /usr/local/bin/initdb -D /var/lib/postgresql/{{ POSTGRES_VERSION }}/airflow_data -U airflow
  args:
    executable: /bin/bash
    creates: /var/lib/postgresql/{{ POSTGRES_VERSION }}/airflow_data/postgresql.conf
  when: not db_data.stat.exists
  register: initdb_result
  ignore_errors: true
  become: true
  become_user: postgres

- name: Show initdb output if it reported errors
  ansible.builtin.debug:
    msg: "initdb returned rc={{ initdb_result.rc }}, stderr={{ initdb_result.stderr }}"
  when: not db_data.stat.exists and initdb_result is failed

- name: Setup postgres port
  ansible.builtin.lineinfile:
    path: /var/lib/postgresql/{{ POSTGRES_VERSION }}/airflow_data/postgresql.conf
    regexp: '^port ='
    line: "port = {{ AIRFLOW_POSTGRES_PORT }}"
  become: true
  become_user: postgres
  register: pg_port_changed

- name: Setup postgres listen addresses
  ansible.builtin.lineinfile:
    path: /var/lib/postgresql/{{ POSTGRES_VERSION }}/airflow_data/postgresql.conf
    regexp: '^listen_addresses'
    line: "listen_addresses = '*'"
  become: true
  become_user: postgres
  when: POSTGRES_LOCATION == 'internal'
  register: pg_listen_changed

- name: Configure max connections
  ansible.builtin.lineinfile:
    path: /var/lib/postgresql/{{ POSTGRES_VERSION }}/airflow_data/postgresql.conf
    regexp: '^max_connections = 100'
    line: "max_connections = 1000"
  become: true
  become_user: postgres
  register: pg_maxconn_changed

- name: Configure postgres access
  ansible.builtin.blockinfile:
    path: /var/lib/postgresql/{{ POSTGRES_VERSION }}/airflow_data/pg_hba.conf
    marker: "# {mark} ANSIBLE MANAGED BLOCK"
    block: |
      host all all 127.0.0.1/32 ident
      host all all 127.0.0.1/32 md5
      {% for cidr in pg_hba_extra_cidrs %}
      host all all {{ cidr }} md5
      {% endfor %}
  become: true
  become_user: postgres

- name: Configure postgres access for internal deployments
  ansible.builtin.blockinfile:
    path: /var/lib/postgresql/{{ POSTGRES_VERSION }}/airflow_data/pg_hba.conf
    marker: "# {mark} ANSIBLE MANAGED BLOCK - INTERNAL DB"
    block: |
      host all all 0.0.0.0/0 trust
  become: true
  become_user: postgres
  when: POSTGRES_LOCATION == 'internal'

- name: Start airflow db for initialization
  ansible.builtin.shell: |
    /usr/local/bin/pg_ctl -D /var/lib/postgresql/{{ POSTGRES_VERSION }}/airflow_data -l /var/lib/postgresql/{{ POSTGRES_VERSION }}/airflow_data/logfile start
  args:
    executable: /bin/bash
  when: not db_data.stat.exists
  register: pg_start_result
  ignore_errors: true
  become: true
  become_user: postgres

- name: Show pg_ctl output if it reported errors
  ansible.builtin.debug:
    msg: "pg_ctl start returned rc={{ pg_start_result.rc }}, stderr={{ pg_start_result.stderr }}"
  when: not db_data.stat.exists and pg_start_result is failed

- name: Initialize database with airflow
  ansible.builtin.command: /usr/local/bin/createdb -O airflow airflow -E utf-8 -U airflow -p {{ AIRFLOW_POSTGRES_PORT }}
  when: not db_data.stat.exists
  become: true
  become_user: postgres

- name: Restart airflow-db if postgresql.conf settings changed
  ansible.builtin.systemd:
    name: airflow-db
    state: restarted
    enabled: true
  become: true
  when: >
    db_data.stat.exists and (
      (pg_port_changed is defined and pg_port_changed.changed) or
      (pg_listen_changed is defined and pg_listen_changed.changed) or
      (pg_maxconn_changed is defined and pg_maxconn_changed.changed)
    )

- name: Run airflow db migrate
  ansible.builtin.shell: |
    . /var/lib/venvs/airflow/bin/activate
    AIRFLOW_HOME=/var/lib/airflow airflow db migrate
  args:
    executable: /bin/bash
  become: true
  become_user: airflow

- name: Create initial admin user (first-time only)
  ansible.builtin.shell: |
    . /var/lib/venvs/airflow/bin/activate
    AIRFLOW_HOME=/var/lib/airflow airflow users create \
      --username admin \
      --firstname admin \
      --lastname admin \
      --role Admin \
      --email admin \
      --password "{{ AIRFLOW_ADMIN_PASSWORD | default('admin') }}"
  args:
    executable: /bin/bash
  when: not db_data.stat.exists
  become: true
  become_user: airflow

- name: Stop airflow db (will restart via systemd)
  ansible.builtin.command: pg_ctl -D /var/lib/postgresql/{{ POSTGRES_VERSION }}/airflow_data stop
  when: not db_data.stat.exists
  become: true
  become_user: postgres

- name: Copy airflow-postgresql service
  ansible.builtin.copy:
    dest: /lib/systemd/system/airflow-db.service
    mode: '0644'
    owner: root
    group: root
    content: |
      [Unit]
      Description=PostgreSQL database server for airflow
      After=network.target
      Wants=network.target

      [Service]
      Type=forking

      User=postgres
      Group=postgres

      # Port number for server to listen on
      Environment=PGPORT={{ AIRFLOW_POSTGRES_PORT }}

      # Location of database directory
      Environment=PGDATA=/var/lib/postgresql/{{ POSTGRES_VERSION }}/airflow_data

      # Where to send early-startup messages from the server (before the logging
      # options of postgresql.conf take effect)
      # This is normally controlled by the global default set by systemd
      # StandardOutput=syslog

      # Disable OOM kill on the postmaster
      OOMScoreAdjust=-1000

      ExecStart=/usr/local/bin/pg_ctl start -D ${PGDATA} -s -o "-p ${PGPORT}" -w -t 300
      ExecStop=/usr/local/bin/pg_ctl stop -D ${PGDATA} -s -m fast
      ExecReload=/usr/local/bin/pg_ctl reload -D ${PGDATA} -s

      # Give a reasonable amount of time for the server to start up/shut down
      TimeoutSec=300

      [Install]
      WantedBy=multi-user.target
  become: true
  notify:
    - Reload daemon files
    - Restart airflow db

- name: Ensure airflow-db is started and enabled
  ansible.builtin.systemd:
    name: airflow-db
    state: started
    enabled: true
  become: true
