---
# On Ubuntu, dialout=20 and fax=21 conflict with our desired staff=20 and sudo=21.
# Remap dialout/fax to unused GIDs first, then fix ownership of any affected files.
# Only runs if dialout currently occupies GID 20 (i.e. remapping hasn't been done yet).
- name: Check if GID normalization is needed
  ansible.builtin.shell:
    cmd: "set -o pipefail && getent group dialout | cut -d: -f3"
    executable: /bin/bash
  register: dialout_gid
  changed_when: false
  become: true
  when: OS == 'Ubuntu' and AUTH_SOURCE != 'ipa'

- name: Normalize GIDs (move dialout and fax out of the way)
  ansible.builtin.shell: |
    set -e
    groupmod -g 48 dialout
    groupmod -g 49 fax
    find / -xdev -group 20 -exec chgrp -h dialout {} \;
    find / -xdev -group 21 -exec chgrp -h fax {} \;
    groupmod -g 20 staff
    groupmod -g 21 sudo
    find / -xdev -group 50 -exec chgrp -h staff {} \;
    find / -xdev -group 27 -exec chgrp -h sudo {} \;
  become: true
  when: OS == 'Ubuntu' and AUTH_SOURCE != 'ipa' and dialout_gid.stdout | default('') == '20'

- name: Ensure groups exist
  ansible.builtin.group:
    name: "{{ item.name }}"
    gid: "{{ item.gid }}"
    state: present
  become: true
  loop: "{{ GROUPS }}"
  when: AUTH_SOURCE != 'ipa'

- name: Ensure all user groups exist
  ansible.builtin.group:
    name: "{{ item.username }}"
    gid: "{{ item.uid }}"
    state: present
  become: true
  loop: "{{ USERS }}"
  when: AUTH_SOURCE != 'ipa'

- name: Ensure all automation user groups exist
  ansible.builtin.group:
    name: "{{item.value.username }}"
    gid: "{{ item.value.uid }}"
    state: present
  become: true
  loop: "{{ AUTOMATION_USERS | dict2items }}"
  when: AUTH_SOURCE != 'ipa'

- name: Ensure all service user groups exist
  ansible.builtin.group:
    name: "{{item.value.username }}"
    gid: "{{ item.value.uid }}"
    state: present
  become: true
  loop: "{{ SERVICE_USERS | dict2items }}"
  when: AUTH_SOURCE != 'ipa'

- name: Include Linux specific tasks
  ansible.builtin.include_tasks: linux.yaml
  when: OS == 'Ubuntu' or OS == 'EL'

- name: Include Ubuntu specific tasks
  ansible.builtin.include_tasks: sudo.yaml
  when: OS == 'Ubuntu' or OS == 'EL'
