---
- name: Format managed swapfile
  ansible.builtin.command: "mkswap {{ base_swapfile_path }}"

- name: Restart cron
  ansible.builtin.systemd:
    name: "{{ 'crond' if OS == 'EL' else 'cron' }}"
    state: restarted
    enabled: true

- name: Restart fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted
    enabled: true

- name: Restart firewalld
  ansible.builtin.systemd:
    name: firewalld
    state: restarted
    enabled: true

- name: Restart resolved
  ansible.builtin.systemd:
    name: systemd-resolved
    state: restarted
    enabled: true
