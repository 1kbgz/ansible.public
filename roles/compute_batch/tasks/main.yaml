---
- name: Install compute batch slice
  ansible.builtin.template:
    src: compute-batch.slice.j2
    dest: /etc/systemd/system/compute-batch.slice
    owner: root
    group: root
    mode: '0644'
  become: true
  notify: Reload compute batch systemd units

- name: Validate compute batch slice
  ansible.builtin.command:
    argv:
      - systemd-analyze
      - verify
      - /etc/systemd/system/compute-batch.slice
  changed_when: false
  become: true

- name: Flush compute batch handlers
  ansible.builtin.meta: flush_handlers
