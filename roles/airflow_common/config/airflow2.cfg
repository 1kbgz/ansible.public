[core]
dags_folder = /var/lib/airflow/dags
hostname_callable = airflow.utils.net.getfqdn
might_contain_dag_callable = airflow.utils.file.might_contain_dag_via_default_heuristic

default_timezone = {{ AIRFLOW_TIMEZONE }}

executor = CeleryExecutor
auth_manager = airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager

parallelism = 32
max_active_tasks_per_dag = 16
dags_are_paused_at_creation = True
max_active_runs_per_dag = 3

load_examples = False

plugins_folder = /var/lib/airflow/plugins

execute_tasks_new_python_interpreter = False

fernet_key = {{ AIRFLOW_FERNET_KEY }}

donot_pickle = True

dagbag_import_timeout = 30.0
dagbag_import_error_tracebacks = True
dagbag_import_error_traceback_depth = 2

dag_file_processor_timeout = 50

task_runner = StandardTaskRunner

killed_task_cleanup_time = 60

dag_run_conf_overrides_params = True

dag_discovery_safe_mode = True

default_task_retries = 0
default_task_retry_delay = 300
max_task_retry_delay = 86400

default_task_weight_rule = downstream

min_serialized_dag_update_interval = 30

compress_serialized_dags = False

min_serialized_dag_fetch_interval = 10

max_num_rendered_ti_fields_per_task = 30

check_slas = True

xcom_backend = airflow.models.xcom.BaseXCom

lazy_load_plugins = True

lazy_discover_providers = True

hide_sensitive_var_conn_fields = True

default_pool_task_slot_count = 128

database_access_isolation = False

test_connection = Disabled

[database]
alembic_ini_file_path = alembic.ini

sql_alchemy_conn = postgresql://airflow@{{ AIRFLOW_POSTGRES_HOST }}:{{ AIRFLOW_POSTGRES_PORT }}/airflow

sql_engine_encoding = utf-8

sql_alchemy_pool_enabled = True

sql_alchemy_pool_size = 5

sql_alchemy_max_overflow = 10

sql_alchemy_pool_recycle = 1800

sql_alchemy_pool_pre_ping = True

load_default_connections = True

max_db_retries = 3

check_migrations = True

[logging]
base_log_folder = /var/lib/airflow/logs

remote_logging = False

delete_local_logs = False

encrypt_s3_logs = False

logging_level = INFO

fab_logging_level = WARNING

colored_console_log = True

{% raw %}
colored_log_format = [%%(blue)s%%(asctime)s%%(reset)s] {%%(blue)s%%(filename)s:%%(reset)s%%(lineno)d} %%(log_color)s%%(levelname)s%%(reset)s - %%(log_color)s%%(message)s%%(reset)s

colored_formatter_class = airflow.utils.log.colored_log.CustomTTYColoredFormatter

log_format = [%%(asctime)s] {%%(filename)s:%%(lineno)d} %%(levelname)s - %%(message)s

simple_log_format = %%(asctime)s %%(levelname)s - %%(message)s

dag_processor_log_target = file

dag_processor_log_format = [%%(asctime)s] [SOURCE:DAG_PROCESSOR] {%%(filename)s:%%(lineno)d} %%(levelname)s - %%(message)s

log_formatter_class = airflow.utils.log.timezone_aware.TimezoneAware

dag_processor_manager_log_location = /var/lib/airflow/logs/dag_processor_manager.log

task_log_reader = task
{% endraw %}

worker_log_server_port = {{ AIRFLOW_WORKER_LOG_SERVER_PORT }}

trigger_log_server_port = {{ AIRFLOW_TRIGGER_LOG_SERVER_PORT }}

celery_stdout_stderr_separation = False

enable_task_context_logger = True

[secrets]
backend =
backend_kwargs =
use_cache = False
cache_ttl_seconds = 900

[cli]
api_client = airflow.api.client.local_client

endpoint_url = http://airflow:{{ AIRFLOW_APISERVER_PORT }}

[debug]
fail_fast = False

[api]
enable_experimental_api = False
auth_backends = airflow.api.auth.backend.session
maximum_page_limit = 100
fallback_page_limit = 100
enable_xcom_deserialize_support = False

[operators]
default_owner = airflow
default_deferrable = false
default_cpus = 1
default_ram = 512
default_disk = 512
default_gpus = 0
default_queue = default
allow_illegal_arguments = False

[webserver]
access_denied_message = Access is Denied
config_file = /var/lib/airflow/webserver_config.py
base_url = http://airflow:{{ AIRFLOW_APISERVER_PORT }}

default_ui_timezone = {{ AIRFLOW_TIMEZONE }}

web_server_host = 0.0.0.0

web_server_port = {{ AIRFLOW_APISERVER_PORT }}

web_server_ssl_cert =

web_server_ssl_key =

session_backend = database

web_server_master_timeout = 120

web_server_worker_timeout = 120

worker_refresh_batch_size = 1

worker_refresh_interval = 6000

reload_on_plugin_change = False

secret_key = {{ AIRFLOW_SECRET_KEY }}

workers = 4

worker_class = sync

access_logfile = -

error_logfile = -

access_logformat =

expose_config = True

expose_hostname = True

expose_stacktrace = True

dag_default_view = grid

dag_orientation = LR

grid_view_sorting_order = topological

log_fetch_timeout_sec = 5

log_fetch_delay_sec = 2

log_auto_tailing_offset = 30

log_animation_speed = 1000

hide_paused_dags_by_default = False

page_size = 100

navbar_color = #fff

navbar_text_color = #51504f

default_dag_run_display_number = 25

enable_proxy_fix = False

proxy_fix_x_for = 1

proxy_fix_x_proto = 1

proxy_fix_x_host = 1

proxy_fix_x_port = 1

proxy_fix_x_prefix = 1

cookie_secure = False

cookie_samesite = Lax

default_wrap = False

x_frame_enabled = True

show_recent_stats_for_completed_runs = True

update_fab_perms = True

session_lifetime_minutes = 43200

instance_name_has_markup = False

auto_refresh_interval = 3

warn_deployment_exposure = True

audit_view_excluded_events = gantt,landing_times,tries,duration,calendar,graph,grid,tree,tree_data

enable_swagger_ui = True

run_internal_api = False

auth_rate_limited = True

auth_rate_limit = 5 per 40 second

caching_hash_method = md5

show_trigger_form_if_no_params = True

allow_raw_html_descriptions = False

[email]
email_backend = airflow.utils.email.send_email_smtp
email_conn_id = smtp_default
default_email_on_retry = True
default_email_on_failure = True

from_email = {{ AIRFLOW_SMTP_USER }}
ssl_context = default

[smtp]
smtp_host = {{ AIRFLOW_SMTP_HOST }}
smtp_starttls = True
smtp_ssl = False
smtp_user = {{ AIRFLOW_SMTP_USER }}
smtp_password = {{ AIRFLOW_SMTP_PASSWORD }}
smtp_port = {{ AIRFLOW_SMTP_PORT }}
smtp_mail_from = {{ AIRFLOW_SMTP_USER }}
smtp_timeout = 30
smtp_retry_limit = 5

[scheduler]
job_heartbeat_sec = 5
scheduler_heartbeat_sec = 5
local_task_job_heartbeat_sec = 0
num_runs = -1
scheduler_idle_sleep_time = 1
min_file_process_interval = 30
parsing_cleanup_interval = 60
stale_dag_threshold = 50
dag_dir_list_interval = 30
print_stats_interval = 30
pool_metrics_interval = 5.0
scheduler_health_check_threshold = 30
enable_health_check = False
scheduler_health_check_server_host = 0.0.0.0
scheduler_health_check_server_port = {{ AIRFLOW_APISERVER_PORT + 1 }}
orphaned_tasks_check_interval = 300.0
child_process_log_directory = /var/lib/airflow/logs/scheduler
scheduler_zombie_task_threshold = 300
zombie_detection_interval = 10.0
catchup_by_default = False
ignore_first_depends_on_past_by_default = True
max_tis_per_query = 16
use_row_level_locking = True
max_dagruns_to_create_per_loop = 10
max_dagruns_per_loop_to_schedule = 20
schedule_after_task_execution = True
parsing_pre_import_modules = True
parsing_processes = 2
file_parsing_sort_mode = modified_time
standalone_dag_processor = False
max_callbacks_per_loop = 20
dag_stale_not_seen_duration = 600
use_job_schedule = True
allow_trigger_in_future = False
trigger_timeout_check_interval = 15
task_queued_timeout = 600.0
task_queued_timeout_check_interval = 120.0
allowed_run_id_pattern = ^[A-Za-z0-9_.~:+-]+$

[triggerer]
default_capacity = 1000
job_heartbeat_sec = 5
triggerer_health_check_threshold = 30

[sensors]
default_timeout = 604800

[celery]
celery_app_name = airflow.providers.celery.executors.celery_executor

worker_concurrency = 8

worker_prefetch_multiplier = 1

worker_enable_remote_control = true

broker_url = redis://redis:{{ AIRFLOW_REDIS_PORT }}/0

result_backend_sqlalchemy_engine_options =

flower_host = 0.0.0.0

flower_url_prefix =

flower_port = {{ AIRFLOW_FLOWER_PORT }}

flower_basic_auth =

sync_parallelism = 0

celery_config_options = airflow.providers.celery.executors.default_celery.DEFAULT_CELERY_CONFIG

ssl_active = False

ssl_key =
ssl_cert =
ssl_cacert =

pool = prefork

operation_timeout = 1.0

task_track_started = True

task_publish_max_retries = 3

worker_precheck = False
