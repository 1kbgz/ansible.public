- name: Mount home shared nfs drive
  ansible.posix.mount:
    src: "airflow-sharedrive:/volume1/Developer/home/airflow"
    path: /home/airflow
    opts: "soft,timeo=30,retrans=3"
    fstype: nfs
    state: mounted
  become: true
  when: "AIRFLOW_LOCATION == 'internal' and OS != 'macOS' and not (nfs_check.failed | default(false))"

- name: Mount data shared nfs drive
  ansible.posix.mount:
    src: "airflow-sharedrive:/volume1/Developer/data/airflow"
    path: /data/airflow
    opts: "soft,timeo=30,retrans=3"
    fstype: nfs
    state: mounted
  become: true
  when: "AIRFLOW_LOCATION == 'internal' and OS != 'macOS' and not (nfs_check.failed | default(false))"
