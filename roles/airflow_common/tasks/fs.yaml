---
- name: Create airflow directory
  ansible.builtin.file:
    path: /var/lib/airflow
    state: directory
    mode: '0775'
    owner: airflow
    group: services
  become: true

# TODO uid here needs to be standardized across servers
- name: Check NFS host reachability
  ansible.builtin.wait_for:
    host: airflow-sharedrive
    port: 2049
    timeout: 10
    state: started
  register: nfs_check
  ignore_errors: true
  when: "AIRFLOW_LOCATION == 'internal' and OS != 'macOS'"

- name: Warn if NFS host is unreachable
  ansible.builtin.debug:
    msg: "NFS host airflow-sharedrive is unreachable — NFS mounts will be skipped"
  when: "AIRFLOW_LOCATION == 'internal' and OS != 'macOS' and (nfs_check.failed | default(false))"

- name: Mount airflow lib via nfs
  ansible.posix.mount:
    src: "airflow-sharedrive:/volume1/Developer/var/lib/airflow"
    path: /var/lib/airflow
    opts: "soft,timeo=30,retrans=3"
    fstype: nfs
    state: mounted
  become: true
  when: "AIRFLOW_LOCATION == 'internal' and OS != 'macOS' and not (nfs_check.failed | default(false))"

- name: Create airflow celery dags directory
  ansible.builtin.file:
    path: /var/lib/airflow/dags
    state: directory
    mode: '0775'
    owner: airflow
    group: services
  become: true

- name: Create airflow celery lib directory
  ansible.builtin.file:
    path: /var/lib/airflow/celery
    state: directory
    mode: '0775'
    owner: airflow
    group: services
  become: true

# NOTE: put in /var/lib/airflow for shared mount
- name: Create airflow log directory
  ansible.builtin.file:
    path: /var/lib/airflow/logs
    state: directory
    mode: '0775'
    owner: airflow
    group: services
  become: true

- name: Create airflow scheduler log directory
  ansible.builtin.file:
    path: /var/lib/airflow/logs/scheduler
    state: directory
    mode: '0775'
    owner: airflow
    group: services
  become: true

- name: Create airflow celery log directory
  ansible.builtin.file:
    path: /var/lib/airflow/logs/celery
    state: directory
    mode: '0775'
    owner: airflow
    group: services
  become: true

- name: Set AIRFLOW_HOME for any logins
  ansible.builtin.copy:
    dest: /etc/profile.d/airflow.sh
    content: 'export AIRFLOW_HOME=/var/lib/airflow'
  become: true

- name: Create airflow data directory
  ansible.builtin.file:
    path: /data/airflow
    state: directory
    mode: '0775'
    owner: airflow
    group: services
  become: true

- name: Create airflow home directory
  ansible.builtin.file:
    path: /home/airflow
    state: directory
    mode: '0775'
    owner: airflow
    group: services
  become: true

